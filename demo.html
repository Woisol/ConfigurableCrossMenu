  <script>
    // 不对，为什么要用 IIFE 包裹？直接放在外面不行吗？因为要等 DOM 加载完成，或者说等元素存在了再绑定事件，不然 document.getElementById('ccm-con') 就拿不到元素了。
    // woc，加 defer 无法解决
    // (() => {
    document.addEventListener('DOMContentLoaded', () => {
      const ccm = document.getElementById('ccm-con');
      if (!ccm) return;

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      if (reduceMotion || !canHover) return;

      const update = (event) => {
        const rect = ccm.getBoundingClientRect();
        const nx = ((event.clientX - rect.left) / rect.width - 0.5) * 2;
        const ny = ((event.clientY - rect.top) / rect.height - 0.5) * 2;

        ccm.style.setProperty('--ccm-parallax-x', `${(nx * 24).toFixed(2)}px`);
        ccm.style.setProperty('--ccm-parallax-y', `${(ny * 24).toFixed(2)}px`);
        ccm.style.setProperty('--ccm-tilt-x', `${(nx * 5).toFixed(2)}deg`);
        ccm.style.setProperty('--ccm-tilt-y', `${(-ny * 4).toFixed(2)}deg`);
      };

      const reset = () => {
        ccm.style.setProperty('--ccm-parallax-x', '0px');
        ccm.style.setProperty('--ccm-parallax-y', '0px');
        ccm.style.setProperty('--ccm-tilt-x', '0deg');
        ccm.style.setProperty('--ccm-tilt-y', '0deg');
      };

      // 据说如果只是简单变量读写浏览器已经做了优化可以不加 requestAnimationFrame
      ccm.addEventListener('pointermove', update, { passive: true });
      ccm.addEventListener('pointerleave', reset, { passive: true });
    });
    // })();
  </script>

  <script>
    globalThis.ccmSelectAwaitingDirection = null;
    globalThis.ccmSelectAwaitingTimer = null;
    globalThis.ccmSelectAwaitDelayMS = 5000;


    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      const keyMap = {
        w: 'up',
        arrowup: 'up',
        d: 'right',
        arrowright: 'right',
        s: 'down',
        arrowdown: 'down',
        a: 'left',
        arrowleft: 'left'
      };

      const direction = keyMap[key];
      if (direction) {
        event.preventDefault();
        _ccmHandlePress(direction);
      }

    });

    /**
     * 通用清理选择状态工具函数
     */
    function _ccmClearSelecting(delay) {
      function _clear() {
        const selectingItems = document.querySelectorAll(`.ccm-items.selecting`);
        ccmSelectAwaitingDirection = null;
        selectingItems.forEach(item => {
          item.classList.remove('selecting');
        })
      }
      if (ccmSelectAwaitingTimer) {
        clearTimeout(ccmSelectAwaitingTimer);
        ccmSelectAwaitingTimer = null;
      }
      if (delay) {
        ccmSelectAwaitingTimer = setTimeout(_clear, delay === true ? ccmSelectAwaitDelayMS : delay);
      } else {
        _clear();
      }
    }
    /**
     * 按下事件通用处理
     */
    function _ccmHandlePress(direction) {
      if (!direction) throw new Error('direction is required');

      // 重复点击重置选择 timer
      if (ccmSelectAwaitingDirection !== null) {
        if (direction === ccmSelectAwaitingDirection) {
          _ccmClearSelecting(true);
          return;
        }
        function _ccmIsVertical(direction) {
          return ['up', 'down'].includes(direction);
        }
        function _ccmIsHorizontal(direction) {
          return ['left', 'right'].includes(direction);
        }

        function _ccmTriggerAwaitingSelection(direction) {
          // if (!ccmSelectAwaitingDirection) {
          //   return false;
          // }

          const selectingItems = document.querySelectorAll(`.ccm-items.${ccmSelectAwaitingDirection}`);
          if (selectingItems.length === 0) {
            return false;
          }

          const awaitingIsVertical = _ccmIsVertical(ccmSelectAwaitingDirection);
          const canResolveByCrossAxis = awaitingIsVertical
            ? _ccmIsHorizontal(direction)
            : _ccmIsVertical(direction);

          // 点击了选择方向的对向，清楚选择
          if (!canResolveByCrossAxis) {
            _ccmClearSelecting();
            return true;
          }

          // 对不起不能直接借用……
          // const orderedItems = [].sort.call(selectingItems, (leftItem, rightItem) => {
          const orderedItems = Array.from(selectingItems).sort((leftItem, rightItem) => {
            const leftRect = leftItem.getBoundingClientRect();
            const rightRect = rightItem.getBoundingClientRect();

            return awaitingIsVertical
              ? leftRect.left - rightRect.left
              : leftRect.top - rightRect.top;
          });

          const targetItem = awaitingIsVertical
            ? (direction === 'left' ? orderedItems[0] : orderedItems[orderedItems.length - 1])
            : (direction === 'up' ? orderedItems[0] : orderedItems[orderedItems.length - 1]);

          if (!targetItem) {
            return false;
          }

          targetItem.click();
          _ccmClearSelecting(1000);
          return true;
        }


        if (_ccmTriggerAwaitingSelection(direction)) {
          return;
        }

        _ccmClearSelecting();
      }


      const menuItems = document.querySelectorAll(`.ccm-items.${direction}`);
      if (!menuItems) {
        return
      }
      menuItems.forEach(item => {
        item.classList.add('selecting');
      });
      // 如果有多个 up 菜单项，进入选择状态，等待用户再次点击确认选择哪个菜单项
      if (menuItems.length > 1) {
        ccmSelectAwaitingDirection = direction;
        _ccmClearSelecting(true);
      } else {
        // 只有一个 up 菜单项，直接触发点击
        menuItems[0].click();
        _ccmClearSelecting(1000);
      }
    }

    function ccmHandlePressDown() {

    }
  </script>
