<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConfigableCrossMenu Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      background: #eee;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', sans-serif;
    }

    body.dark {
      background: #333;
    }

    .info {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: #333;
      font-size: 14px;
      opacity: 0.8;
    }

    .info p {
      margin: 5px 0;
    }
  </style>
  <link rel="stylesheet" href="./dist/configable-cross-menu.css">
  <!-- <script src="./dist/configable-cross-menu.js" defer></script> -->
  <style>
    :root {
      --ccm-width: 200px;
      /* --ccm-radius: 20px; */
      --ccm-bg-menu-color: hsl(0, 0%, 93%);
      --ccm-bg-center-color: hsl(0, 0%, 100%, 0.5);
      --ccm-bg-opacity: 1;
      --ccm-bg-blur: 4px;
      /* icon 不存在时设置 0px */
      --ccm-center-icon-size: 0px;
      /* 直接设置数字给 css 并不能生效……js 里手动加上 px 吧 */
      --ccm-center-title-size: 30px;
      --ccm-center-title-color: hsl(0, 0%, 20%);
      --ccm-center-subtitle-size: 15px;
      --ccm-center-subtitle-color: hsl(0, 0%, 50%);
      --ccm-center-border-size: 2px;
      --ccm-center-border-color: hsl(0, 0%, 80%);
      --ccm-center-radius: 20px;
      --ccm-menu-length: 100px;
      --ccm-menu-color: hsl(0, 0%, 20%);
      --ccm-menu-radius: 8px;
    }

    .dark {
      --ccm-bg-menu-color: hsl(0, 0%, 30%);
      --ccm-bg-center-color: hsl(0, 0%, 50%);
      --ccm-center-title-color: hsl(0, 0%, 90%);
      --ccm-center-subtitle-color: hsl(0, 0%, 80%);
      --ccm-center-border-color: hsl(0, 0%, 50%);
      --ccm-menu-color: hsl(0, 0%, 90%);
      color: hsl(0, 0%, 90%);
    }
  </style>
</head>

<body class="dark.not">
  <div id="ccm-con" class="ccm-con row">
    <!-- deg 也必须设置否则后续的 transform 不生效 -->
    <button class="ccm-items text-up"
      style="--ccm-item-size: 25px; --ccm-items-offset: 0px;--ccm-item-deg: 30deg;--ccm-item-x: 10px; --ccm-item-offset: 20px; --ccm-item-hover-offset: 28px; --ccm-item-bg-color: hsl(200, 100%, 80%);">
      <!-- 但是设置了背景又对深色支持不好…… -->
      <span>家 home</span>
    </button>
    <button class="ccm-items text-up"
      style="--ccm-item-size: 25px;--ccm-item-deg: -30deg;--ccm-item-x: -10px; --ccm-item-offset: 20px;">关于</button>
    <button class="ccm-items text-right"
      style="--ccm-item-size: 25px;--ccm-item-deg: 90deg;--ccm-item-x: 0px; --ccm-item-offset: 50px; --ccm-item-offset: 70px; --ccm-item-hover-offset: 40px;">
      联系 contact</button>
    <button class="ccm-items text-down"
      style="--ccm-item-size: 25px;--ccm-item-deg: 0deg;--ccm-item-x: 0px; --ccm-item-offset: 20px; --ccm-item-hover-offset: 28px;">设置
      settings</button>
    <button class="ccm-items text-left"
      style="--ccm-item-size: 25px;--ccm-item-deg: 270deg;--ccm-item-x: 0px; --ccm-item-offset: 80px; --ccm-item-hover-offset: 16px;">111
    </button>
    <div class="ccm-center">
      <img src="" alt="">
      <div class="col">
        <h3>CCM</h3>
        <p>Configurable Cross Menu</p>
      </div>
    </div>
  </div>

  <div class="info">
    <p>🎮 Controls:</p>
    <p>Click on menu items or use:</p>
    <p><kbd>W</kbd> / <kbd>Up</kbd> - Up</p>
    <p><kbd>D</kbd> / <kbd>Right</kbd> - Right</p>
    <p><kbd>S</kbd> / <kbd>Down</kbd> - Down</p>
    <p><kbd>A</kbd> / <kbd>Left</kbd> - Left</p>
  </div>

  <script>
    (() => {
      const ccm = document.getElementById('ccm-con');
      if (!ccm) return;

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      if (reduceMotion || !canHover) return;

      const update = (event) => {
        const rect = ccm.getBoundingClientRect();
        const nx = ((event.clientX - rect.left) / rect.width - 0.5) * 2;
        const ny = ((event.clientY - rect.top) / rect.height - 0.5) * 2;

        ccm.style.setProperty('--ccm-parallax-x', `${(nx * 24).toFixed(2)}px`);
        ccm.style.setProperty('--ccm-parallax-y', `${(ny * 24).toFixed(2)}px`);
        ccm.style.setProperty('--ccm-tilt-x', `${(nx * 5).toFixed(2)}deg`);
        ccm.style.setProperty('--ccm-tilt-y', `${(-ny * 4).toFixed(2)}deg`);
      };

      const reset = () => {
        ccm.style.setProperty('--ccm-parallax-x', '0px');
        ccm.style.setProperty('--ccm-parallax-y', '0px');
        ccm.style.setProperty('--ccm-tilt-x', '0deg');
        ccm.style.setProperty('--ccm-tilt-y', '0deg');
      };

      // 据说如果只是简单变量读写浏览器已经做了优化可以不加 requestAnimationFrame
      ccm.addEventListener('pointermove', update, { passive: true });
      ccm.addEventListener('pointerleave', reset, { passive: true });
    })();
  </script>
