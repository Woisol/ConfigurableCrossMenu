<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConfigableCrossMenu Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      background: #eee;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', sans-serif;
    }

    .info {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: #333;
      font-size: 14px;
      opacity: 0.8;
    }

    .info p {
      margin: 5px 0;
    }
  </style>
  <link rel="stylesheet" href="./dist/configable-cross-menu.css">
  <!-- <script src="./dist/configable-cross-menu.js" defer></script> -->
  <style>
    :root {
      --ccm-width: 200px;
      --ccm-radius: 20px;
      --ccm-bg-menu-color: hsl(0, 0%, 93%);
      --ccm-bg-center-color: hsl(0, 0%, 100%);
      --ccm-bg-opacity: 0.8;
      --ccm-bg-blur: 10px;
      /* icon 不存在时设置 0px */
      --ccm-center-icon-size: 0px;
      /* 直接设置数字给 css 并不能生效……js 里手动加上 px 吧 */
      --ccm-center-title-size: 30px;
      --ccm-center-subtitle-size: 15px;
      --ccm-center-subtitle-color: hsl(0, 0%, 50%);
      --ccm-center-border-size: 2px;
      --ccm-center-border-color: hsl(0, 0%, 80%);
      --ccm-menu-length: 100;
      --ccm-menu-color: hsl(0, 0%, 20%);
    }
  </style>
</head>

<body>
  <div id="ccm-con" class="ccm-con row">
    <div class="ccm-center">
      <img src="" alt="">
      <div class="col">
        <h3>CCM</h3>
        <p>Configurable Cross Menu</p>
      </div>
    </div>
    <!-- deg 也必须设置否则后续的 transform 不生效 -->
    <button class="ccm-items" style="--ccm-item-deg: 0deg;--ccm-item-x: 10px; --ccm-item-y: 10px;">home</button>
    <button class="ccm-items">about</button>
    <button class="ccm-items">contact</button>
    <button class="ccm-items">settings</button>
  </div>

  <div class="info">
    <p>🎮 Controls:</p>
    <p>Click on menu items or use:</p>
    <p><kbd>W</kbd> / <kbd>Up</kbd> - Up</p>
    <p><kbd>D</kbd> / <kbd>Right</kbd> - Right</p>
    <p><kbd>S</kbd> / <kbd>Down</kbd> - Down</p>
    <p><kbd>A</kbd> / <kbd>Left</kbd> - Left</p>
  </div>
