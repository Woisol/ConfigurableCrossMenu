  <script defer>
    const defaultConfig = {
      container: "#ccm-con",
      startingDirections: 'up',
      style: {
        width: 200,
        radius: 50,
        background: {
          menuColor: { light: 'hsl(0, 0%, 93%)', dark: 'hsl(0, 0%, 30%)' },
          centerColor: { light: 'hsl(0, 0%, 100%)', dark: 'hsl(0, 0%, 50%)' },
          opacity: 0.8,
          blur: 10,
        },
        center: {
          title: { content: 'CCM', size: 16, color: { light: 'hsl(0, 0%, 20%)', dark: 'hsl(0, 0%, 90%)' }, radius: '5%' },
          subtitle: { content: 'Configurable Cross Menu', size: 12, color: { light: 'hsl(0, 0%, 50%)', dark: 'hsl(0, 0%, 80%)' } },
          style: { direction: 'column', color: { light: 'hsl(0, 0%, 20%)', dark: 'hsl(0, 0%, 90%)' }, borderSize: 2, borderColor: 'hsl(0, 0%, 80%)', radius: 20 },
        },
        menu: {
          length: 100,

          color: { light: 'hsl(0, 0%, 40%)', dark: 'hsl(0, 0%, 60%)' },
          radius: 8,
        }
      },
      // items: [],
      keyBindings: {}
    };
    const items = [
      { direction: 'up', label: 'Up', action: () => alert('Up'), url: 'https://bilibili.com' },
      { direction: 'right', label: 'Right', action: () => alert('Right') },
      { direction: 'down', label: 'Down1', action: () => alert('Down') },
      { direction: 'down', label: 'Down2', url: 'https://bilibili.com' },
      { direction: 'left', label: 'Left', action: () => alert('Left') },
    ]

    import('./dist/configable-cross-menu.js').then(() => {
      const centerTemplate = window.ConfigableCrossMenu?.centerTemplate;
      const menuItemTemplate = window.ConfigableCrossMenu?.menuItemTemplate;
      if (!centerTemplate) {
        throw new Error('centerTemplate is not available');
      }
      if (!menuItemTemplate) {
        throw new Error('menuItemTemplate is not available');
      }
      const center = centerTemplate({ title: "abc", subtitle: "123", icon: "src/assets/icon.png" });

      const container = document.getElementById('ccm-con');
      if (!container) {
        throw new Error('Container element not found');
      }
      container.insertAdjacentHTML('beforeend', center);
      console.log(center);

      // const menuItem = menuItemTemplate({ direction: 'up', label: 'Test Item', url: 'https://bilibili.com', action: "alert('Test')", size: '2em', rotate: '60deg', x: '0px', offset: '80px', hoverOffset: '60px', bgColor: 'hsl(200, 100%, 80%)' });
      // container.insertAdjacentHTML('beforeend', menuItem);

      const groupedItems = [
        items.filter(item => item.direction === 'up'),
        items.filter(item => item.direction === 'right'),
        items.filter(item => item.direction === 'down'),
        items.filter(item => item.direction === 'left'),
      ];
      const degMap = {
        up: 0,
        right: 90,
        down: 0,
        left: 270,
      }
      const delegateFunctions = {}
      items.forEach(item => {
        if (typeof item.action === 'function') {
          const funcHash = Math.random().toString(36).substr(2, 9);
          delegateFunctions[funcHash] = item.action;
          item.action = `__ccm_dispatch_func('${funcHash}')`;
        }
      });
      window.__ccm_dispatch_func = function (funcHash) {
        const func = delegateFunctions[funcHash];
        if (func) {
          func();
        } else {
          console.warn(`No function found for hash: ${funcHash}`);
        }
      }



      function _createMenuItem(item, rotateOffset = 0, x = 0) {
        const menuItemHTML = menuItemTemplate({ ...item, action: String(item.action), rotate: `${degMap[item.direction] + rotateOffset}deg`, x: `${x}px` });
        container.insertAdjacentHTML('beforeend', menuItemHTML);

      }

      groupedItems.forEach(group => {
        if (group.length === 0) return;
        if (group.length === 1) {
          const item = group[0];
          _createMenuItem(item);
        } if (group.length === 2) {
          const [first, second] = group;
          _createMenuItem(first, -30, -6);
          _createMenuItem(second, 30, 6);
          // const firstItemHTML = menuItemTemplate({ ...first, rotate: `${degMap[first.direction] - 30}deg`, x: '-6px' });
          // const secondItemHTML = menuItemTemplate({ ...second, rotate: `${degMap[second.direction] + 30}deg`, x: '6px' });
          // container.insertAdjacentHTML('beforeend', firstItemHTML);
          // container.insertAdjacentHTML('beforeend', secondItemHTML);
        }
      })


    })
  </script>
